ort:
  analyzer:
    skipExcluded: true
    disabledPackageManagers:
      - SBT
      - CocoaPods
      - PIP
      - NuGet
      - Bazel
    # ORT >= 89 is built with Java 25 and defaults the Gradle daemon to that
    # version, which Gradle 8.13/Groovy of this project cannot parse
    # ("Unsupported class file major version 69"). The "javaVersion" option
    # did not help in CI (its JDK bootstrap never took effect, and it overrides
    # "javaHome"), so scripts/run-ort.sh passes an explicit JDK 21 home via
    # -P ort.analyzer.packageManagers.GradleInspector.options.javaHome=...
    # taken from the ORT_GRADLE_JAVA_HOME environment variable.
  scanner:
    skipExcluded: true
    detectedLicenseMapping:
      LicenseRef-scancode-unknown-license-reference: NOASSERTION
    storages:
      local:
        backend:
          localFileStorage:
            directory: ~/.ort/scanner
    storageReaders:
      - local
    storageWriters:
      - local
  packageConfigurationProviders:
    - type: Dir
      options:
        path: ort/config/package-configurations
        mustExist: false
