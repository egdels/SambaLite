name: ORT Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-analyze-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.13 cannot run on Java 25, so the Gradle Inspector gets its
      # own JDK 21 (passed to scripts/run-ort.sh as ORT_GRADLE_JAVA_HOME).
      - name: Set up Java 21 for Gradle
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ORT >= 89 is built with and requires Java 25. This step runs last so
      # JAVA_HOME points at it.
      - name: Set up Java 25 for ORT
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install ORT
        run: |
          # Pinned: a new ORT release can add analyzers or checks that fail the job unnoticed.
          ORT_VERSION=97.2.0
          # The release asset's URL directly: asking the API for it, unauthenticated from a shared
          # runner, can hit the rate limit and return an error without assets (jq: "Cannot iterate
          # over null"). -f fails the step on an HTTP error instead of extracting an error page.
          curl -fsSL -o ort.tgz \
            "https://github.com/oss-review-toolkit/ort/releases/download/${ORT_VERSION}/ort-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          sudo mv ort-*/ /opt/ort
          sudo ln -s /opt/ort/bin/ort /usr/local/bin/ort

      - name: Run ORT (Analyze + Report)
        env:
          ORT_GRADLE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: |
          chmod +x scripts/run-ort.sh
          ./scripts/run-ort.sh

      - name: Upload ORT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ort-reports
          path: ort-out/

  scancode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ScanCode
        run: |
          # plugincode 32 finds no hooks with pluggy 1.7 ("did not find any 'pre_scan' hooks").
          pip install "scancode-toolkit==32.5.0" "pluggy<1.7"
          scancode --version

      - name: Run ScanCode
        run: |
          chmod +x scripts/run-scancode.sh
          ./scripts/run-scancode.sh

      - name: Upload ScanCode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scancode-reports
          path: ort-out/scancode/
